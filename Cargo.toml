[workspace]
resolver = "2"
members = ["crates/castable-core", "crates/castable-net", "crates/castable-players"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vincecao/castable-core"
rust-version = "1.85"

[workspace.dependencies]
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
castable-core = { path = "crates/castable-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
socket2 = "0.5"
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
